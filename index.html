<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1E5B43" id="meta-theme">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="اللصيقات">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<title>طباعة اللصيقات</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Changa:wght@400;700&family=Noto+Naskh+Arabic:wght@400;700&family=Cairo:wght@400;700&family=Reem+Kufi:wght@400;700&family=Roboto:wght@400;700&family=Montserrat:wght@400;700&family=Lora:wght@400;700&display=swap" rel="stylesheet">
<script>
  (function(){ var t = 'auto'; try { t = localStorage.getItem('lsq_theme') || 'auto'; } catch(e){}
    var dark = t === 'dark' || (t === 'auto' && matchMedia('(prefers-color-scheme: dark)').matches);
    document.documentElement.dataset.theme = dark ? 'dark' : 'light'; })();
</script>
<style>
:root{
  --bg:#FAF5EA; --card:#FFFDF7; --card-2:#FBF6EC; --line:#EADFC8;
  --green:#1E5B43; --green-2:#26704F; --green-d:#0F3D2C; --green-l:#E2EEE6; --green-ink:#174A36;
  --gold:#C9A04E; --gold-hi:#E6C579; --gold-l:#F5EAD0; --gold-ink:#7A5A1E;
  --ink:#2E261D; --muted:#85776A;
  --brick:#B04A35; --brick-l:#F8E2DA;
  --head-a:#2A7A56; --head-b:#1E5B43; --head-c:#0E3527;
  --on-head:#FFF8E8; --on-head-2:#CFE3D6;
  --shadow:0 10px 24px -16px rgba(46,38,29,.45);
  --r-xl:30px; --r-lg:22px; --r-md:14px;
  --safe-b:env(safe-area-inset-bottom,0px);
  --nav-w:0px;
}
[data-theme="dark"]{
  --bg:#0D1814; --card:#14231C; --card-2:#182A22; --line:#24392F;
  --green:#2E8462; --green-2:#36946E; --green-d:#0A2A1E; --green-l:#1A3529; --green-ink:#BFE3CF;
  --gold:#D8B25F; --gold-hi:#F0CF83; --gold-l:#332A18; --gold-ink:#F0CF83;
  --ink:#ECE5D5; --muted:#9AA79F;
  --brick:#E27C64; --brick-l:#3A211B;
  --head-a:#1C5A41; --head-b:#123E2E; --head-c:#06180F;
  --on-head:#FFF4DC; --on-head-2:#A9C9B7;
  --shadow:0 10px 24px -14px rgba(0,0,0,.7);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans Arabic",system-ui,sans-serif;font-size:16px;line-height:1.55;transition:background .25s}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.num{font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate}
.hidden{display:none!important}

/* ── الرأس ── */
.head{position:relative;color:var(--on-head);padding:16px 20px 64px;
  background:
    radial-gradient(120% 90% at 85% 0%, rgba(230,197,121,.22), transparent 55%),
    radial-gradient(90% 70% at 0% 100%, rgba(0,0,0,.25), transparent 60%),
    linear-gradient(165deg,var(--head-a) 0%,var(--head-b) 48%,var(--head-c) 100%);
  overflow:hidden;isolation:isolate}
.head::before{content:"";position:absolute;inset:0;background-image:var(--motif);background-size:120px 120px;opacity:.16;z-index:-1;
  -webkit-mask-image:linear-gradient(180deg,#000 30%,transparent 95%);mask-image:linear-gradient(180deg,#000 30%,transparent 95%)}
.waves{position:absolute;left:0;right:0;bottom:-1px;width:100%;height:58px;display:block;z-index:1}
.waves .w1{fill:rgba(230,197,121,.18)}
.waves .w2{fill:none;stroke:url(#mg);stroke-width:2;opacity:.95}
.waves .w3{fill:var(--bg);transition:fill .25s}
.head-top{position:relative;display:flex;align-items:center;justify-content:space-between;gap:12px;z-index:2}
.brand{font-family:Amiri,serif;font-weight:700;font-size:30px;line-height:1.05;
  background:linear-gradient(180deg,#FFF3CF 0%,#E8C676 32%,#B8862E 52%,#F2D58E 72%,#C9A04E 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.brand-sub{display:block;font-size:13px;color:var(--on-head-2);margin-top:2px}
.head-actions{display:flex;gap:8px;align-items:center}
.icon-btn{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;color:var(--gold-hi);
  background:rgba(255,255,255,.07);border:1px solid rgba(230,197,121,.55);box-shadow:inset 0 0 0 3px rgba(255,255,255,.03)}
.icon-btn svg{width:20px;height:20px}
.install-chip{height:42px;border-radius:999px;padding:0 14px;display:flex;align-items:center;gap:6px;font-size:14px;font-weight:600;
  color:#0F3D2C;background:linear-gradient(180deg,#F0D59A,#C9A04E);border:1px solid rgba(255,255,255,.45);box-shadow:0 6px 14px -8px rgba(0,0,0,.6)}
.install-chip svg{width:18px;height:18px}
.head-body{position:relative;margin-top:14px;display:flex;align-items:center;justify-content:space-between;gap:12px;z-index:2}
.head-title{font-family:Amiri,serif;font-size:26px;line-height:1.2}
.head-sub{font-size:14px;color:var(--on-head-2)}
.ring{position:relative;width:80px;height:80px;flex:none}
.ring svg{width:80px;height:80px;transform:rotate(-90deg)}
.ring .lbl{position:absolute;inset:0;display:grid;place-items:center;text-align:center;font-size:12px;line-height:1.15;color:var(--on-head-2)}
.ring .lbl b{display:block;font-size:19px;color:var(--gold-hi)}

/* ── التخطيط ── */
.layout{min-height:100vh}
main{padding:4px 14px calc(108px + var(--safe-b));max-width:1180px;margin:0 auto}
.panel{background:var(--card);border-radius:var(--r-lg);box-shadow:var(--shadow);padding:16px;margin-bottom:12px;border:1px solid var(--line)}
.notice{border-radius:var(--r-md);padding:10px 14px;margin:8px 0 12px;font-size:14px}
.notice.warn{background:var(--brick-l);color:var(--brick);border:1px solid color-mix(in srgb,var(--brick) 30%,transparent)}
.notice.info{background:var(--gold-l);color:var(--gold-ink);border:1px solid color-mix(in srgb,var(--gold) 40%,transparent)}
.notice.ok{background:var(--green-l);color:var(--green-ink);border:1px solid color-mix(in srgb,var(--green) 30%,transparent)}
.section-h{display:flex;align-items:center;justify-content:space-between;margin:14px 4px 10px;gap:10px}
.section-h h2{margin:0;font-family:Amiri,serif;font-size:23px;font-weight:700;color:var(--green-ink)}
[data-theme="light"] .section-h h2{color:var(--green-d)}
.empty{text-align:center;color:var(--muted);padding:22px 10px}
.cards{display:grid;gap:12px}
.hint{font-size:13px;color:var(--muted);text-align:center;margin-top:8px}

/* ── البطاقات ── */
.wcard{background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);padding:14px;box-shadow:var(--shadow)}
.wtop{display:flex;align-items:center;gap:12px}
.wname{flex:1;min-width:0}
.wname b{display:block;font-size:17px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wname span{font-size:13px;color:var(--muted)}
.wbtns{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.thumb{flex:none;position:relative;background:#fff;border-radius:6px;box-shadow:0 0 0 1px var(--line),0 6px 12px -10px rgba(0,0,0,.5);overflow:hidden}

/* ── الأزرار ── */
.btn-main{display:block;width:100%;border-radius:999px;color:#FFF8E8;padding:14px 18px;font-weight:600;font-size:17px;
  background:linear-gradient(180deg,var(--green-2),var(--green) 55%,var(--green-d));border:1px solid var(--gold);
  box-shadow:inset 0 0 0 2px rgba(255,255,255,.1),inset 0 1px 0 rgba(255,255,255,.25),0 10px 20px -12px rgba(15,61,44,.9)}
.btn-main:active{filter:brightness(.92)}
.btn-main[disabled]{opacity:.55}
.btn-ghost{display:block;width:100%;border-radius:999px;color:var(--gold-ink);padding:12px 18px;font-weight:600;background:var(--card);
  border:1.5px solid var(--gold);box-shadow:inset 0 0 0 3px var(--card),inset 0 0 0 4px color-mix(in srgb,var(--gold) 35%,transparent)}
.btn-danger{display:block;width:100%;border-radius:999px;color:#fff;padding:13px 18px;font-weight:600;
  background:linear-gradient(180deg,color-mix(in srgb,var(--brick) 85%,#fff),var(--brick));border:1px solid color-mix(in srgb,var(--brick) 60%,#000)}
.btn-small{border-radius:999px;padding:7px 14px;font-size:14px;font-weight:600;background:var(--green-l);color:var(--green-ink);border:1px solid color-mix(in srgb,var(--green) 35%,transparent);white-space:nowrap}
.btn-small.gold{background:var(--gold-l);color:var(--gold-ink);border-color:color-mix(in srgb,var(--gold) 55%,transparent)}
.btn-small.red{background:var(--brick-l);color:var(--brick);border-color:color-mix(in srgb,var(--brick) 35%,transparent)}
.actions{display:grid;gap:10px;margin-top:16px}
.step{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-size:20px;line-height:1;color:var(--green-ink);flex:none;
  background:var(--card);border:1px solid color-mix(in srgb,var(--gold) 55%,var(--line))}
[data-theme="light"] .step{color:var(--green)}
.step:active{background:var(--gold-l)}

/* ── التنقل ── */
nav.tabs{position:fixed;bottom:0;left:0;right:0;z-index:20;background:color-mix(in srgb,var(--card) 92%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:6px 6px calc(6px + var(--safe-b))}
nav.tabs .nav-brand{display:none}
nav.tabs button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;color:var(--muted);padding:6px 0;border-radius:14px}
nav.tabs svg{width:23px;height:23px;stroke-width:1.6}
nav.tabs button.on{color:var(--green-ink);font-weight:600}
[data-theme="light"] nav.tabs button.on{color:var(--green-d)}
nav.tabs button.on svg{color:var(--gold)}

/* ── القوائم والحقول ── */
.prow{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.prow:last-child{border-bottom:0}
.prow .grow{flex:1;min-width:0}
.prow b{font-weight:600;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prow small{display:block;color:var(--muted);font-size:13px}
.qty{display:flex;align-items:center;gap:5px;flex:none}
.qty input{width:58px;text-align:center;border:1px solid var(--line);border-radius:12px;padding:6px 2px;font-size:17px;font-weight:700;background:var(--card-2)}
.qty.sm input{width:48px;font-size:15px;padding:5px 2px}
.qty.sm .step{width:32px;height:32px;font-size:18px}
.tag{font-size:12px;border-radius:999px;padding:2px 10px;background:var(--green-l);color:var(--green-ink);white-space:nowrap}
.tag.gold{background:var(--gold-l);color:var(--gold-ink)}
.x-btn{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:var(--brick);flex:none}
.x-btn svg{width:18px;height:18px}

.field{margin-bottom:12px}
.field label{display:block;font-size:14px;color:var(--muted);margin-bottom:4px}
.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);background:var(--card-2);border-radius:var(--r-md);padding:11px 13px;font-size:16px}
.field input:focus,.field select:focus{border-color:var(--gold);outline:none;box-shadow:0 0 0 3px color-mix(in srgb,var(--gold) 25%,transparent)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.seg{display:flex;background:var(--card-2);border:1px solid var(--line);border-radius:999px;padding:3px;gap:3px}
.seg button{flex:1;border-radius:999px;padding:8px 6px;font-size:15px;color:var(--muted)}
.seg button.on{background:linear-gradient(180deg,var(--green-2),var(--green));color:#fff;font-weight:600;box-shadow:inset 0 0 0 1px var(--gold)}
.switch{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 0;cursor:pointer}
.switch small{display:block;color:var(--muted);font-size:13px}
.switch input{width:48px;height:28px;appearance:none;-webkit-appearance:none;background:var(--line);border-radius:999px;position:relative;transition:background .2s;cursor:pointer;flex:none;margin:0}
.switch input::after{content:"";position:absolute;top:3px;right:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:right .2s;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.switch input:checked{background:var(--green)}
.switch input:checked::after{right:23px}
.guide{font-size:13px;color:var(--muted);margin:0;padding-inline-start:18px}
.guide li{margin-bottom:2px}

/* ── سطور المحتوى ── */
.lrow{background:var(--card-2);border:1px solid var(--line);border-radius:var(--r-md);padding:8px;margin-bottom:8px}
.lrow .lt{width:100%;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:9px 11px;font-size:16px}
.lrow .lt:focus{border-color:var(--gold);outline:none}
.lctl{display:flex;align-items:center;gap:5px;margin-top:6px;flex-wrap:wrap}
.lctl select{flex:1 1 100px;min-width:0;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:7px 8px;font-size:15px}
.b-btn{width:36px;height:36px;border-radius:10px;font-weight:800;font-size:17px;border:1px solid var(--line);background:var(--card);color:var(--muted);flex:none}
.b-btn.on{background:linear-gradient(180deg,var(--green-2),var(--green));color:#fff;border-color:var(--gold)}

/* ── الورقة واللصيقة (بالمليمتر الحقيقي) ── */
.sheet-wrap{position:relative;width:100%;overflow:hidden}
.sheet-scale{position:absolute;top:0;right:0;transform-origin:top right}
.page{position:relative;width:210mm;height:296.8mm;background:#fff;color:#111;overflow:hidden}
.sheet-wrap .page{box-shadow:0 0 0 1px #e6dcc6,0 14px 28px -18px rgba(0,0,0,.55);border-radius:3px}
.page-in{position:absolute;inset:0}
.lb{position:absolute;display:flex;flex-direction:column;overflow:hidden;color:#111;background:#fff}
.lb-in{flex:none;width:max-content;min-width:100%}
.ln{white-space:pre}
.pv .lb{outline:.35mm dashed #CDBB8E;outline-offset:-.35mm}
.pv .lb.empty{background:#FCFAF4}
.pv .lb.skip{background:repeating-linear-gradient(45deg,#EFE7D6 0 2mm,#fff 2mm 4mm);cursor:pointer}
.pv .lb.click{cursor:pointer}
.lb.bd{border:.25mm solid #000}
.lb.test{border:.25mm dashed #000;align-items:center;justify-content:center;font:700 14pt 'IBM Plex Sans Arabic',sans-serif;color:#555}
.lb.test::before,.lb.test::after{content:"";position:absolute;background:#999}
.lb.test::before{width:6mm;height:.2mm;top:50%;left:50%;transform:translate(-50%,-50%)}
.lb.test::after{width:.2mm;height:6mm;top:50%;left:50%;transform:translate(-50%,-50%)}
.pager{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;gap:8px}
.pager b{font-family:Amiri,serif;font-size:21px;color:var(--green-ink)}
.solo-box{display:grid;place-items:center;background:repeating-linear-gradient(45deg,var(--card-2) 0 8px,var(--card) 8px 16px);border:1px solid var(--line);border-radius:var(--r-md);padding:14px;margin-bottom:12px;min-height:120px}
.solo{position:relative;flex:none;box-shadow:0 0 0 1px #d8c9a4,0 10px 20px -14px rgba(0,0,0,.5);border-radius:3px;overflow:hidden;background:#fff}
.solo .lb{top:0;right:0;transform-origin:top right}

/* ── النوافذ ── */
.sheet-bg{position:fixed;inset:0;background:rgba(10,20,15,.5);z-index:40;display:flex;align-items:flex-end;justify-content:center;animation:fade .18s ease}
.sheet{background:var(--card);width:100%;max-width:620px;max-height:92vh;overflow:auto;border-radius:var(--r-xl) var(--r-xl) 0 0;padding:8px 18px calc(20px + var(--safe-b));animation:up .22s ease;border-top:2px solid var(--gold)}
.sheet .grip{width:44px;height:5px;border-radius:5px;background:var(--line);margin:6px auto 10px}
.sheet h3{font-family:Amiri,serif;font-size:24px;margin:4px 0 2px;color:var(--green-ink)}
[data-theme="light"] .sheet h3{color:var(--green-d)}
.sheet h4{margin:16px 0 8px;font-size:15px;color:var(--gold-ink)}
.sheet .sub{color:var(--muted);font-size:14px;margin-bottom:12px}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(96px + var(--safe-b));z-index:60;background:var(--green-d);color:#fff;padding:11px 18px;border-radius:999px;font-size:15px;box-shadow:var(--shadow);max-width:90vw;text-align:center;animation:up .2s ease;border:1px solid var(--gold)}
.toast.err{background:var(--brick);border-color:transparent}

/* ── الحاسوب ── */
@media (min-width:900px){
  :root{--nav-w:232px}
  .layout{padding-right:var(--nav-w)}
  nav.tabs{top:0;bottom:0;right:0;left:auto;width:var(--nav-w);flex-direction:column;justify-content:flex-start;gap:4px;padding:22px 14px;
    border-top:0;border-left:1px solid var(--line);background:var(--card)}
  nav.tabs .nav-brand{display:block;font-family:Amiri,serif;font-size:30px;font-weight:700;text-align:center;margin:0 0 18px;
    background:linear-gradient(180deg,#FFF3CF 0%,#E8C676 32%,#B8862E 52%,#F2D58E 72%,#C9A04E 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
  [data-theme="light"] nav.tabs .nav-brand{background:linear-gradient(180deg,#B8862E,#7A5A1E);-webkit-background-clip:text;background-clip:text}
  nav.tabs button{flex:none;flex-direction:row;justify-content:flex-start;gap:12px;font-size:16px;padding:12px 16px}
  nav.tabs button.on{background:var(--green-l);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--gold) 45%,transparent)}
  .head{padding:22px 34px 74px}
  .head-inner{max-width:1180px;margin:0 auto}
  main{padding:4px 28px 40px}
  .cards{grid-template-columns:repeat(auto-fill,minmax(340px,1fr))}
  .ptab{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px;align-items:start}
  .ptab .pv-col{position:sticky;top:14px}
  .sheet-bg{align-items:center}
  .sheet{border-radius:var(--r-xl);border:1px solid var(--gold);max-height:88vh}
  .sheet .grip{display:none}
  .toast{bottom:28px}
}

/* ── الطباعة ── */
#print-area{position:fixed;left:-99999px;top:0}
@media print{
  @page{size:A4;margin:0}
  html,body{background:#fff!important;margin:0!important;padding:0!important}
  body>*:not(#print-area){display:none!important}
  #print-area{position:static!important;left:auto!important}
  .page{break-after:page;page-break-after:always;box-shadow:none!important;border-radius:0!important}
  .page:last-child{break-after:auto;page-break-after:auto}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
</style>
</head>
<body>
<div id="app"></div>
<div id="print-area"></div>

<script>
/* ═══════════ الثوابت ═══════════ */
const MM = 96 / 25.4;               // بكسل في المليمتر
const A4W = 210, A4H = 297;
const FONTS = [
  {k:'changa', n:'شانقا — Changa',          css:"'Changa'"},
  {k:'amiri',  n:'أميري — Amiri',           css:"'Amiri'"},
  {k:'naskh',  n:'النسخ — Noto Naskh',       css:"'Noto Naskh Arabic'"},
  {k:'cairo',  n:'القاهرة — Cairo',          css:"'Cairo'"},
  {k:'kufi',   n:'الكوفي — Reem Kufi',       css:"'Reem Kufi'"},
  {k:'plex',   n:'بلكس — IBM Plex Arabic',   css:"'IBM Plex Sans Arabic'"},
  {k:'roboto', n:'Roboto (فرنسي)',          css:"'Roboto'"},
  {k:'mont',   n:'Montserrat (فرنسي)',      css:"'Montserrat'"},
  {k:'lora',   n:'Lora (فرنسي)',            css:"'Lora'"}
];
const ALIGN = {r:'right', c:'center', l:'left'};
const VALIGN = {t:'flex-start', m:'center', b:'flex-end'};

const $ = (s, r=document) => r.querySelector(s);
const $$ = (s, r=document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const LS = {
  get(k, d=null){ try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch(e){ return d; } },
  set(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){ toast('تعذّر الحفظ على الجهاز', true); } }
};
function toast(msg, err=false){
  $$('.toast').forEach(t => t.remove());
  const t = document.createElement('div'); t.className = 'toast' + (err ? ' err' : ''); t.textContent = msg;
  document.body.appendChild(t); setTimeout(() => t.remove(), 2600);
}

function seed(){

  const t2 = {id:uid(), name:'ورق 2 × 7 — 99×38', w:99, h:38, cols:2, rows:7, top:15.5, side:6, gx:0, gy:0};
  const c1 = {id:uid(), name:'مثال: براغي M6', tplId:t1.id, align:'c', valign:'m', pad:2, lh:1.25, fit:true, lines:[
    {t:'براغي M6', f:'changa', s:18, b:true},
    {t:'Vis M6 × 30', f:'roboto', s:10, b:false},
    {t:'العلبة: 100 قطعة', f:'naskh', s:11, b:false}]};
  return {tpls:[t1, t2], items:[c1], queue:[{itemId:c1.id, qty:24}], tplId:t1.id, start:1, border:false, cal:{x:0, y:0}};
}
let D = LS.get('lsq_data') || seed();
D.tpls ||= []; D.items ||= []; D.queue ||= []; D.cal ||= {x:0, y:0}; D.start ||= 1;
if (!D.tpls.length) D = seed();
const save = () => LS.set('lsq_data', D);
const tplById = id => D.tpls.find(t => t.id === id);
const tpl = () => tplById(D.tplId) || D.tpls[0];
const itemById = id => D.items.find(i => i.id === id);
const fontOf = k => FONTS.find(f => f.k === k) || FONTS[0];
const perSheet = T => T.cols * T.rows;

/* ═══════════ رسم اللصيقة والورقة ═══════════ */
function linesHTML(it){
  return `<div class="lb-in" style="line-height:${it.lh || 1.25}">${it.lines.map(l => {
    const F = fontOf(l.f);
    return `<div class="ln" dir="auto" style="font-family:${F.css},'IBM Plex Sans Arabic',sans-serif;font-size:calc(${num(l.s,12)}pt * var(--k,1));font-weight:${l.b ? 700 : 400}">${esc(l.t) || '&nbsp;'}</div>`;
  }).join('')}</div>`;
}
function labelStyle(it, T, x, y){
  return `right:${x}mm;top:${y}mm;width:${T.w}mm;height:${T.h}mm;padding:${num(it.pad,2)}mm;justify-content:${VALIGN[it.valign] || 'center'};text-align:${ALIGN[it.align] || 'center'}`;
}
function cellPos(T, idx){
  const r = Math.floor(idx / T.cols), c = idx % T.cols;
  return { x: r2(T.side + c * (T.w + T.gx)), y: r2(T.top + r * (T.h + T.gy)) };
}
/* mode: preview | print | test | outline */
function pageHTML(T, cells, mode, pageNo=0){
  const per = perSheet(T);
  const shift = (mode === 'print' || mode === 'test') ? `transform:translate(${num(D.cal.x)}mm,${num(D.cal.y)}mm)` : '';
  let h = '';
  for (let i = 0; i < per; i++){
    const {x, y} = cellPos(T, i), c = cells[i];
    const base = `right:${x}mm;top:${y}mm;width:${T.w}mm;height:${T.h}mm`;
    if (mode === 'test'){ h += `<div class="lb test" style="${base}">${i+1}</div>`; continue; }
    if (mode === 'outline'){ h += `<div class="lb empty" style="${base}"></div>`; continue; }
    if (c && c !== 'skip'){
      h += `<div class="lb${D.border ? ' bd' : ''}${mode==='preview' && pageNo===0 ? ' click' : ''}" data-i="${i}" ${c.fit ? 'data-fit' : ''} style="${labelStyle(c, T, x, y)}">${linesHTML(c)}</div>`;
    } else if (mode === 'preview'){
      h += `<div class="lb ${c === 'skip' ? 'skip' : 'empty'}${pageNo===0 ? ' click' : ''}" data-i="${i}" style="${base}"></div>`;
    }
  }
  return `<div class="page"><div class="page-in" style="${shift}">${h}</div></div>`;
}
function fitAll(root){
  $$('.lb[data-fit]', root).forEach(lb => {
    const inn = lb.firstElementChild; if (!inn) return;
    inn.style.setProperty('--k', 1);
    const cs = getComputedStyle(lb);
    const aw = lb.clientWidth - num(cs.paddingLeft) - num(cs.paddingRight);
    const ah = lb.clientHeight - num(cs.paddingTop) - num(cs.paddingBottom);
    const k = Math.min(1, aw / inn.offsetWidth, ah / inn.offsetHeight);
    if (k < 1) inn.style.setProperty('--k', (k * 0.97).toFixed(3));
  });
}
function overflows(lb){
  const inn = lb.firstElementChild, cs = getComputedStyle(lb);
  return inn.offsetWidth > lb.clientWidth - num(cs.paddingLeft) - num(cs.paddingRight) + 1 ||
         inn.offsetHeight > lb.clientHeight - num(cs.paddingTop) - num(cs.paddingBottom) + 1;
}
/* معاينة مصغّرة للصيقة واحدة داخل صندوق بعرض/ارتفاع أقصى */
function soloHTML(it, T, maxW, maxH){
  const s = Math.min(maxW / (T.w * MM), maxH / (T.h * MM));
  return `<div class="solo" style="width:${T.w*MM*s}px;height:${T.h*MM*s}px"><div class="lb" ${it.fit ? 'data-fit' : ''} style="${labelStyle(it, T, 0, 0)};transform:scale(${s})">${linesHTML(it)}</div></div>`;
}
function sheetThumb(T, w){
  const s = w / (A4W * MM);
  return `<div class="thumb pv" style="width:${w}px;height:${A4H*MM*s}px"><div style="position:absolute;top:0;right:0;transform:scale(${s});transform-origin:top right">${pageHTML(T, [], 'outline')}</div></div>`;
}

/* بناء خلايا الطباعة من قائمة "ما يُطبع" */
function buildCells(){
  const T = tpl(), per = perSheet(T);
  const seq = [];
  D.queue.forEach(q => { const it = itemById(q.itemId); if (it) for (let i = 0; i < q.qty; i++) seq.push(it); });
  const skip = Math.min(Math.max(1, D.start) - 1, per - 1);
  const total = skip + seq.length;
  const pages = Math.max(1, Math.ceil(total / per));
  const cells = new Array(pages * per).fill(null);
  for (let i = 0; i < skip; i++) cells[i] = 'skip';
  seq.forEach((it, i) => cells[skip + i] = it);
  return { cells, pages, per, count: seq.length, skip, T };
}

let installEvt = null;
const isStandalone = () => matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
const canInstall = () => !isStandalone() && (installEvt || isIOS);

window.addEventListener('appinstalled', () => { installEvt = null; renderHead(); toast('ثُبّت التطبيق'); });

  if (installEvt){ installEvt.prompt(); const r = await installEvt.userChoice; if (r.outcome === 'accepted') installEvt = null; renderHead(); return; }
  if (isIOS) openSheet(`<h3>تثبيت التطبيق على آيفون</h3><div class="sub">آيفون لا يسمح بزر تثبيت مباشر:</div>

    <div class="prow"><div class="grow">٣. اختر «إضافة إلى الشاشة الرئيسية»</div></div></div>
    <button class="btn-main" onclick="closeSheet()">فهمت</button>`);
}

function applyTheme(){
  let t = 'auto'; try { t = localStorage.getItem('lsq_theme') || 'auto'; } catch(e){}
  const dark = t === 'dark' || (t === 'auto' && matchMedia('(prefers-color-scheme: dark)').matches);

/* ═══════════ النوافذ ═══════════ */
function openSheet(html, onMount){
  closeSheet();
  const bg = document.createElement('div'); bg.className = 'sheet-bg'; bg.id = 'sheet';
  bg.innerHTML = `<div class="sheet" role="dialog" aria-modal="true"><div class="grip"></div>${html}</div>`;
  bg.addEventListener('click', e => { if (e.target === bg) closeSheet(); });
  document.body.appendChild(bg);
  const sh = $('.sheet', bg);
  if (onMount) onMount(sh);
  return sh;
}
function closeSheet(){ const s = $('#sheet'); if (s) s.remove(); }
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeSheet(); });
function confirmBox(title, msg, okLabel='تأكيد', danger=false){
  return new Promise(res => {
    openSheet(`<h3>${esc(title)}</h3><div class="sub">${esc(msg)}</div><div class="actions">
      <button class="${danger ? 'btn-danger' : 'btn-main'}" id="cf-ok">${esc(okLabel)}</button><button class="btn-ghost" id="cf-no">إلغاء</button></div>`, sh => {
      $('#cf-ok', sh).onclick = () => { closeSheet(); res(true); };
      $('#cf-no', sh).onclick = () => { closeSheet(); res(false); };
    });
  });
}
function stepper(id, val, cls=''){
  return `<div class="qty ${cls}" data-qty="${id}"><button class="step" data-d="-1" aria-label="إنقاص">−</button><input id="${id}" class="num" inputmode="decimal" value="${esc(val)}"><button class="step" data-d="1" aria-label="زيادة">+</button></div>`;
}
/* ربط أزرار + و − بخانة رقمية */
function bindSteppers(root, step, onSet){
  $$('[data-qty]', root).forEach(box => {
    const inp = $('input', box), st = typeof step === 'function' ? step(inp.id) : step;
    $$('.step', box).forEach(b => b.onclick = () => { inp.value = r2(num(inp.value) + st * num(b.dataset.d)); onSet(inp.id, inp.value); });
    inp.onchange = () => onSet(inp.id, inp.value);
  });
}

/* ═══════════ الهيكل ═══════════ */
const TABS = [['print','الطباعة',IC.print],['items','المحتويات',IC.label],['tpls','القوالب',IC.sheet]];
function renderShell(){
  $('#app').innerHTML = `<div class="layout"><header class="head" id="head"></header><main id="main"></main></div>
    <nav class="tabs"><div class="nav-brand">اللصيقات</div>${TABS.map(([k,l,ic]) => `<button data-tab="${k}">${ic}<span>${l}</span></button>`).join('')}</nav>`;
  $$('nav.tabs button').forEach(b => b.onclick = () => goTab(b.dataset.tab));
}
function renderHead(){
  const T = tpl();
  let title, sub, ring = '';
  if (S.tab === 'print'){
    const b = buildCells(), used = (b.skip + b.count) % b.per || (b.count ? b.per : 0);
    title = 'طباعة اللصيقات'; sub = `${esc(T.name)} · ${b.pages} ${b.pages > 1 ? 'أوراق' : 'ورقة'}`;
    const C = 2 * Math.PI * 34, p = b.per ? used / b.per : 0;
    ring = `<div class="ring"><svg viewBox="0 0 80 80"><circle cx="40" cy="40" r="34" fill="none" stroke="rgba(255,255,255,.14)" stroke-width="6"/>
      <circle cx="40" cy="40" r="34" fill="none" stroke="#E6C579" stroke-width="6" stroke-linecap="round" stroke-dasharray="${C*p} ${C}"/></svg>
      <div class="lbl"><span><b class="num">${b.count}</b>لصيقة</span></div></div>`;
  } else if (S.tab === 'items'){ title = 'المحتويات'; sub = `${D.items.length} محتوى محفوظ`; }
  else { title = 'قوالب الأوراق'; sub = `${D.tpls.length} قالب · قِس بالمسطرة مرة واحدة`; }
  $('#head').innerHTML = `<div class="head-inner"><div class="head-top"><div><div class="brand">اللصيقات</div><span class="brand-sub">طباعة على أوراق A4 اللاصقة</span></div>
    <div class="head-actions">${canInstall() ? `<button class="install-chip" id="h-inst">${IC.install}<span>ثبّت</span></button>` : ''}<button class="icon-btn" id="h-menu" aria-label="القائمة">${IC.menu}</button></div></div>
    <div class="head-body"><div><div class="head-title">${title}</div><div class="head-sub">${sub}</div></div>${ring}</div></div>${WAVES}`;
  $('#h-menu').onclick = openMenu;
  if ($('#h-inst')) $('#h-inst').onclick = doInstall;
}
function goTab(t){
  S.tab = t;
  $$('nav.tabs button').forEach(b => b.classList.toggle('on', b.dataset.tab === t));
  renderHead();
  ({print:renderPrint, items:renderItems, tpls:renderTpls})[t]();
  window.scrollTo(0, 0);
}

/* ═══════════ تبويب الطباعة ═══════════ */
function renderPrint(){
  const T = tpl(), per = perSheet(T);
  S.page = Math.min(S.page, buildCells().pages - 1);
  $('#main').innerHTML = `<div class="ptab"><div>
    <div class="panel">
      <div class="field"><label>قالب الورقة</label><select id="p-tpl">${D.tpls.map(t => `<option value="${t.id}" ${t.id === T.id ? 'selected' : ''}>${esc(t.name)}</option>`).join('')}</select></div>
      <div class="prow"><div class="grow">ابدأ من اللصيقة رقم<small>لورقة استُعمل جزء منها · أو اضغط على اللصيقة في المعاينة</small></div>${stepper('p-start', D.start, 'sm')}</div>
      <label class="switch"><span>إطار أسود حول كل لصيقة<small>مفيد عند الطباعة على ورق عادي</small></span><input type="checkbox" id="p-bd" ${D.border ? 'checked' : ''}></label>
    </div>
    <div class="section-h"><h2>ما يُطبع</h2><button class="btn-small gold" id="p-add">+ أضف محتوى</button></div>
    <div class="panel" id="p-queue"></div>
    <div class="actions"><button class="btn-main" id="p-go">معاينة وطباعة</button><button class="btn-ghost" id="p-test">ورقة اختبار للمعايرة</button></div>
  </div>
  <div class="pv-col"><div class="panel"><div class="pager" id="p-pager"></div><div class="sheet-wrap pv" id="pv"><div class="sheet-scale"></div></div>
    <div class="hint">المخطّط بالأسفل مثل الورقة تماماً · المربعات المخطّطة لن تُطبع</div></div></div></div>`;
  $('#p-tpl').onchange = e => { D.tplId = e.target.value; D.start = 1; S.page = 0; save(); goTab('print'); };
  $('#p-bd').onchange = e => { D.border = e.target.checked; save(); drawPreview(); };
  bindSteppers($('#main'), 1, (id, v) => { D.start = Math.min(per, Math.max(1, Math.round(num(v, 1)))); save(); $('#p-start').value = D.start; refreshPrint(); });
  $('#p-add').onclick = openAddSheet;
  $('#p-go').onclick = openPrintSheet;
  $('#p-test').onclick = () => doPrint('test');
  $('#pv').onclick = e => {
    const lb = e.target.closest('.lb.click'); if (!lb) return;
    D.start = +lb.dataset.i + 1; save(); $('#p-start').value = D.start; refreshPrint();
    toast(`البداية من اللصيقة ${D.start}`);
  };
  renderQueue(); drawPreview();
  if (!S.ro){ S.ro = new ResizeObserver(() => scalePreview()); }
  S.ro.disconnect(); S.ro.observe($('#pv'));
}
function refreshPrint(){ renderQueue(); drawPreview(); renderHead(); }
function renderQueue(){
  const box = $('#p-queue'); if (!box) return;
  const T = tpl();
  D.queue = D.queue.filter(q => itemById(q.itemId));
  if (!D.queue.length){ box.innerHTML = `<div class="empty">لا شيء بعد.<br>اضغط «أضف محتوى» لاختيار ما تريد طباعته.</div>`; return; }
  box.innerHTML = D.queue.map((q, k) => {
    const it = itemById(q.itemId), other = it.tplId && it.tplId !== T.id && tplById(it.tplId);
    return `<div class="prow" data-k="${k}"><div class="grow"><b>${esc(it.name)}</b><small>${other ? `<span class="tag gold">مصمَّم لـ ${esc(other.name)}</span>` : `${it.lines.length} سطر`}</small></div>
      ${stepper('q-' + k, q.qty, 'sm')}<button class="btn-small" data-fill="${k}" title="املأ باقي الورقة">املأ</button><button class="x-btn" data-del="${k}" aria-label="حذف">${IC.x}</button></div>`;
  }).join('');
  bindSteppers(box, 1, (id, v) => { const k = +id.slice(2); D.queue[k].qty = Math.max(0, Math.round(num(v))); save(); refreshPrint(); });
  $$('[data-fill]', box).forEach(b => b.onclick = () => {
    const k = +b.dataset.fill, c = buildCells(), used = c.skip + c.count, rem = (c.per - used % c.per) % c.per;
    D.queue[k].qty += rem || (used ? 0 : c.per);
    if (!rem && used) toast('الورقة ممتلئة'); save(); refreshPrint();
  });
  $$('[data-del]', box).forEach(b => b.onclick = () => { D.queue.splice(+b.dataset.del, 1); save(); refreshPrint(); });
}
function drawPreview(){
  const pv = $('#pv'); if (!pv) return;
  const c = buildCells();
  S.page = Math.min(S.page, c.pages - 1);
  const slice = c.cells.slice(S.page * c.per, (S.page + 1) * c.per);
  $('.sheet-scale', pv).innerHTML = pageHTML(c.T, slice, 'preview', S.page);
  $('#p-pager').innerHTML = `<b>معاينة</b>${c.pages > 1 ? `<div class="qty sm"><button class="step" id="pg-prev" ${S.page === 0 ? 'disabled' : ''}>${IC.right}</button>
    <span class="num" style="min-width:54px;text-align:center">${S.page + 1} / ${c.pages}</span><button class="step" id="pg-next" ${S.page >= c.pages - 1 ? 'disabled' : ''}>${IC.left}</button></div>` : `<span class="tag">ورقة واحدة</span>`}`;

function addToQueue(id){
  const it = itemById(id); if (!it) return;
  if (!D.queue.length && it.tplId && tplById(it.tplId) && it.tplId !== D.tplId){ D.tplId = it.tplId; D.start = 1; toast('تم اختيار قالب هذا المحتوى'); }
  const c = buildCells(), used = c.skip + c.count, rem = (c.per - used % c.per) % c.per;
  const ex = D.queue.find(q => q.itemId === id);
  const add = rem || c.per;
  if (ex) ex.qty += add; else D.queue.push({itemId:id, qty:add});
  save();
}

async function doPrint(mode){

             ['top','الهامش العلوي'],['side','الهامش الجانبي (يمين)'],['gx','الفراغ بين الأعمدة'],['gy','الفراغ بين الصفوف']];

      <li>من حافة الورقة العليا إلى أعلى أول لصيقة = الهامش العلوي.</li><li>من الحافة اليمنى إلى أول لصيقة = الهامش الجانبي.</li>
      <li>إن كانت اللصيقات ملتصقة ببعضها فالفراغ = 0.</li><li>لا تعرف الهوامش؟ أدخل البقية واضغط «توسيط تلقائي».</li></ol>

  };

}

        const j = JSON.parse(await f.text()), nd = j.data || j;
        if (!Array.isArray(nd.tpls) || !nd.tpls.length || !Array.isArray(nd.items)) throw 0;
        if (!(await confirmBox('استيراد النسخة', `${nd.tpls.length} قالب و ${nd.items.length} محتوى. ستحل محل البيانات الحالية.`, 'استيراد'))) return;
        D = Object.assign({queue:[], start:1, border:false, cal:{x:0, y:0}}, nd);
        if (!tplById(D.tplId)) D.tplId = D.tpls[0].id;
        save(); toast('تم الاستيراد'); goTab('print');
      } catch(err){ toast('الملف غير صالح', true); }
    };
    if ($('#m-inst', sh)) $('#m-inst', sh).onclick = doInstall;
  });
}

/* ═══════════ البدء ═══════════ */
renderShell();
goTab('print');
document.fonts && document.fonts.ready.then(() => { if (S.tab === 'print') drawPreview(); else if (S.tab === 'items') fitAll($('#main')); });
</script>
