<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1E5B43" id="meta-theme">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="اللصيقات">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<title>طباعة اللصيقات</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Changa:wght@400;700&family=Noto+Naskh+Arabic:wght@400;700&family=Cairo:wght@400;700&family=Reem+Kufi:wght@400;700&family=Roboto:wght@400;700&family=Montserrat:wght@400;700&family=Lora:wght@400;700&display=swap" rel="stylesheet">
<script>
  (function(){ var t = 'auto'; try { t = localStorage.getItem('lsq_theme') || 'auto'; } catch(e){}
    var dark = t === 'dark' || (t === 'auto' && matchMedia('(prefers-color-scheme: dark)').matches);
    document.documentElement.dataset.theme = dark ? 'dark' : 'light'; })();
</script>
<style>
:root{
  --bg:#F7F3EA; --card:#FFFFFF; --soft:#F8F4EC; --line:#E8DFCC;
  --green:#1E5B43; --green-2:#26704F; --green-l:#E4EFE8; --green-ink:#174A36;
  --gold:#C9A04E; --gold-hi:#E6C579;
  --ink:#2A241C; --muted:#857869;
  --red:#B04A35; --red-l:#F8E4DD;
  --head-a:#2A7A56; --head-b:#1E5B43; --head-c:#0E3527;
  --shadow:0 1px 2px rgba(42,36,28,.06),0 6px 18px -12px rgba(42,36,28,.25);
  --safe-b:env(safe-area-inset-bottom,0px);
}
[data-theme="dark"]{
  --bg:#0E1814; --card:#15221C; --soft:#1A2A23; --line:#26392F;
  --green:#2E8462; --green-2:#36946E; --green-l:#1C3529; --green-ink:#BFE3CF;
  --gold:#D8B25F; --gold-hi:#F0CF83;
  --ink:#ECE6D8; --muted:#97A49C;
  --red:#E27C64; --red-l:#3A221C;
  --head-a:#1C5A41; --head-b:#123E2E; --head-c:#06180F;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 20px -14px rgba(0,0,0,.7);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans Arabic",system-ui,sans-serif;font-size:15px;line-height:1.5}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
button:disabled{opacity:.35;cursor:default}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.num{font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate}
.hidden{display:none!important}
svg{display:block}

/* ── الرأس ── */
.head{position:relative;color:#FFF8E8;padding:12px 16px 30px;overflow:hidden;
  background:radial-gradient(100% 120% at 90% 0%,rgba(230,197,121,.2),transparent 60%),linear-gradient(165deg,var(--head-a),var(--head-b) 50%,var(--head-c))}
.head::before{content:"";position:absolute;inset:0;background-image:var(--motif);background-size:110px;opacity:.12}
.head-in{position:relative;z-index:2;display:flex;align-items:center;justify-content:space-between;gap:10px;max-width:1180px;margin:0 auto}
.brand{font-family:Amiri,serif;font-weight:700;font-size:26px;line-height:1.1;
  background:linear-gradient(180deg,#FFF3CF,#E8C676 40%,#B8862E 60%,#F2D58E);-webkit-background-clip:text;background-clip:text;color:transparent}
.head-actions{display:flex;gap:8px}
.hbtn{height:36px;min-width:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;gap:6px;padding:0 10px;color:#F0D59A;
  background:rgba(255,255,255,.08);border:1px solid rgba(230,197,121,.35);font-size:13px;font-weight:600}
.hbtn svg{width:18px;height:18px}
.waves{position:absolute;left:0;right:0;bottom:-1px;width:100%;height:24px;z-index:1}
.waves .w1{fill:none;stroke:var(--gold);stroke-width:1.5;opacity:.7}
.waves .w2{fill:var(--bg)}

/* ── التخطيط ── */
main{padding:6px 14px calc(92px + var(--safe-b));max-width:1180px;margin:0 auto}
.page-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:8px 2px 12px}
.page-h h2{margin:0;font-family:Amiri,serif;font-size:22px;font-weight:700;color:var(--green-ink)}
[data-theme="light"] .page-h h2{color:var(--green)}
.sub-h{display:flex;align-items:center;justify-content:space-between;margin:18px 2px 8px}
.sub-h h3{margin:0;font-size:15px;font-weight:600;color:var(--muted)}
.panel{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:6px 14px;margin-bottom:12px}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:52px;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row .lbl{flex:1;min-width:0}
.row .lbl b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .lbl small{display:block;font-size:12.5px;color:var(--muted)}
.meta{font-size:13px;color:var(--muted);padding:2px 2px 0}
.empty{text-align:center;color:var(--muted);padding:26px 10px;font-size:14px}

/* ── الأزرار: ثلاثة أحجام فقط ── */
.btn{height:46px;padding:0 18px;border-radius:12px;font-weight:600;font-size:15px;display:inline-flex;align-items:center;justify-content:center;gap:8px;white-space:nowrap}
.btn.block{display:flex;width:100%}
.btn.primary{background:var(--green);color:#fff;box-shadow:0 6px 14px -10px rgba(15,61,44,.9)}
.btn.primary:active{background:var(--green-2)}
.btn.outline{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.btn.danger{background:var(--red);color:#fff}
.btn.sm{height:34px;padding:0 12px;font-size:13.5px;border-radius:10px}
.btn svg{width:17px;height:17px}
.ibtn{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;color:var(--muted);border:1px solid var(--line);background:var(--card);flex:none}
.ibtn svg{width:17px;height:17px}
.ibtn.danger{color:var(--red)}
.ibtn.on{background:var(--green);color:#fff;border-color:var(--green)}
.btns{display:flex;gap:8px;align-items:center}

/* ── الحقول ── */
.stp{display:inline-flex;align-items:center;height:34px;border:1px solid var(--line);border-radius:10px;background:var(--soft);flex:none;overflow:hidden}
.stp button{width:32px;height:100%;font-size:18px;color:var(--green-ink);display:grid;place-items:center}
[data-theme="light"] .stp button{color:var(--green)}
.stp button:active{background:var(--line)}
.stp input{width:46px;height:100%;border:0;border-inline:1px solid var(--line);background:var(--card);text-align:center;font-weight:600;font-size:15px;padding:0}
.stp input:focus{outline:none;background:var(--soft)}
select.sel,input.inp{height:42px;width:100%;border:1px solid var(--line);background:var(--soft);border-radius:10px;padding:0 12px;font-size:15px}
select.sel:focus,input.inp:focus{outline:none;border-color:var(--gold)}
.row select.sel{width:auto;max-width:62%;height:36px}
.field{margin-bottom:12px}
.field>label{display:block;font-size:13px;color:var(--muted);margin-bottom:4px}
.seg{display:flex;background:var(--soft);border:1px solid var(--line);border-radius:10px;padding:2px;gap:2px}
.seg button{flex:1;height:32px;border-radius:8px;font-size:13.5px;color:var(--muted)}
.seg button.on{background:var(--card);color:var(--green-ink);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.12)}
[data-theme="light"] .seg button.on{color:var(--green)}
.switch input{width:42px;height:24px;appearance:none;-webkit-appearance:none;background:var(--line);border-radius:999px;position:relative;cursor:pointer;flex:none;margin:0;transition:background .2s}
.switch input::after{content:"";position:absolute;top:3px;right:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:right .2s;box-shadow:0 1px 2px rgba(0,0,0,.3)}
.switch input:checked{background:var(--green)}
.switch input:checked::after{right:21px}
.grid2{display:grid;grid-template-columns:1fr;gap:0 18px}
@media (min-width:620px){.grid2{grid-template-columns:1fr 1fr}}
.grid2 .row{min-height:48px}
details.help{font-size:13px;color:var(--muted);margin-top:6px}
details.help summary{cursor:pointer;padding:6px 0;color:var(--green-ink)}
[data-theme="light"] details.help summary{color:var(--green)}
details.help ol{margin:4px 0 0;padding-inline-start:18px}
.note{font-size:13px;border-radius:10px;padding:8px 12px;margin:0 0 12px}
.note.ok{background:var(--green-l);color:var(--green-ink)}
.note.warn{background:var(--red-l);color:var(--red)}

/* ── البطاقات ── */
.cards{display:grid;gap:10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:12px;display:flex;align-items:center;gap:12px}
.card .info{flex:1;min-width:0}
.card .info b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .info small{display:block;font-size:12.5px;color:var(--muted)}
.card .btns{margin-top:8px}
.thumb{flex:none;position:relative;background:#fff;border-radius:4px;box-shadow:0 0 0 1px var(--line);overflow:hidden}
.pick{width:100%;text-align:start}

/* ── سطور المحتوى ── */
.lrow{border:1px solid var(--line);border-radius:12px;padding:8px;margin-bottom:8px;background:var(--soft)}
.lrow .inp{background:var(--card);height:40px}
.lctl{display:flex;align-items:center;gap:6px;margin-top:6px}
.lctl select{flex:1;min-width:0;height:34px;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:0 8px;font-size:13.5px}
.b-btn{font-weight:800;font-size:15px}

/* ── الورقة واللصيقة بالمليمتر الحقيقي ── */
.sheet-wrap{position:relative;width:100%;overflow:hidden}
.sheet-scale{position:absolute;top:0;right:0;transform-origin:top right}
.page{position:relative;background:#fff;color:#111;overflow:hidden}
.sheet-wrap .page{box-shadow:0 0 0 1px #E6DCC6;border-radius:2px}
.page-in{position:absolute;inset:0}
.lb{position:absolute;overflow:hidden;background:#fff}
.lb-box{position:absolute;left:50%;top:50%;display:flex;flex-direction:column;overflow:hidden;color:#111}
.lb-in{flex:none;width:max-content;min-width:100%}
.ln{white-space:pre}
.pv .lb{outline:.3mm dashed #D2C29A;outline-offset:-.3mm}
.pv .lb.empty{background:#FBF9F3}
.pv .lb.skip{background:repeating-linear-gradient(45deg,#EEE6D4 0 2mm,#fff 2mm 4mm)}
.pv .lb.click{cursor:pointer}
.lb.bd{box-shadow:inset 0 0 0 .25mm #000}
.lb.test{box-shadow:inset 0 0 0 .25mm #000;display:grid;place-items:center;font:700 13pt 'IBM Plex Sans Arabic',sans-serif;color:#666}
.pv-head{display:flex;align-items:center;justify-content:space-between;min-height:48px}
.pv-head b{font-weight:600;color:var(--muted);font-size:14px}
.pager{display:flex;align-items:center;gap:8px;font-size:14px}
.pv-panel{padding:4px 14px 14px}
.solo-box{display:grid;place-items:center;background:var(--soft);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px;min-height:110px}
.solo{position:relative;flex:none;box-shadow:0 0 0 1px #D8C9A4,0 8px 16px -12px rgba(0,0,0,.5);border-radius:2px;overflow:hidden;background:#fff}
.solo .lb{top:0;right:0;transform-origin:top right}

/* ── التنقل ── */
nav.tabs{position:fixed;bottom:0;left:0;right:0;z-index:20;background:color-mix(in srgb,var(--card) 94%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  border-top:1px solid var(--line);display:flex;padding:4px 6px calc(4px + var(--safe-b))}
nav.tabs .nav-brand{display:none}
nav.tabs button{flex:1;display:flex;flex-direction:column;align-items:center;gap:1px;font-size:11.5px;color:var(--muted);padding:6px 0;border-radius:12px}
nav.tabs svg{width:22px;height:22px;stroke-width:1.6}
nav.tabs button.on{color:var(--green-ink);font-weight:600}
[data-theme="light"] nav.tabs button.on{color:var(--green)}
nav.tabs button.on svg{color:var(--gold)}

/* ── النوافذ ── */
.sheet-bg{position:fixed;inset:0;background:rgba(10,20,15,.45);z-index:40;display:flex;align-items:flex-end;justify-content:center;animation:fade .15s ease}
.sheet{background:var(--card);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:20px 20px 0 0;padding:6px 16px 0;animation:up .2s ease}
.sheet .grip{width:40px;height:4px;border-radius:4px;background:var(--line);margin:6px auto 8px}
.sheet h3{font-family:Amiri,serif;font-size:21px;margin:2px 0 12px;color:var(--green-ink)}
[data-theme="light"] .sheet h3{color:var(--green)}
.sheet h4{margin:16px 0 8px;font-size:13px;font-weight:600;color:var(--muted)}
.sheet .txt{font-size:14px;color:var(--muted);margin:-6px 0 12px}
.sheet-foot{position:sticky;bottom:0;background:var(--card);display:flex;gap:8px;padding:12px 0 calc(14px + var(--safe-b));margin-top:8px;border-top:1px solid var(--line)}
.sheet-foot .btn{flex:1}
.sheet-foot .btn.primary{flex:2}
@keyframes up{from{transform:translateY(30px);opacity:.5}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + var(--safe-b));z-index:60;background:#1B2A23;color:#fff;padding:9px 16px;border-radius:10px;font-size:14px;box-shadow:var(--shadow);max-width:90vw;text-align:center;animation:up .2s ease}
.toast.err{background:var(--red)}

/* ── الحاسوب ── */
@media (min-width:900px){
  .layout{padding-right:220px}
  nav.tabs{top:0;bottom:0;right:0;left:auto;width:220px;flex-direction:column;gap:2px;padding:20px 12px;border-top:0;border-left:1px solid var(--line);background:var(--card)}
  nav.tabs .nav-brand{display:block;font-family:Amiri,serif;font-size:26px;font-weight:700;text-align:center;margin:0 0 16px;color:var(--gold)}
  nav.tabs button{flex:none;flex-direction:row;gap:10px;font-size:15px;padding:10px 14px}
  nav.tabs button.on{background:var(--green-l)}
  .head{padding:14px 28px 32px}
  main{padding:8px 28px 40px}
  .cards{grid-template-columns:repeat(auto-fill,minmax(320px,1fr))}
  .ptab{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px;align-items:start}
  .pv-col{position:sticky;top:12px}
  .sheet-bg{align-items:center}
  .sheet{border-radius:20px;max-height:88vh}
  .sheet .grip{display:none}
  .toast{bottom:24px}
}

/* ── الطباعة ── */
#print-area{position:fixed;left:-99999px;top:0}
@media print{
  @page{margin:0}
  html,body{background:#fff!important;margin:0!important;padding:0!important}
  body>*:not(#print-area){display:none!important}
  #print-area{position:static!important;left:auto!important}
  .page{break-after:page;page-break-after:always;box-shadow:none!important;border-radius:0!important}
  .page:last-child{break-after:auto;page-break-after:auto}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
</style>
<style id="page-size"></style>
</head>
<body>
<div id="app"></div>
<div id="print-area"></div>

<script>
/* ═══════════ الثوابت ═══════════ */
const MM = 96 / 25.4;
const PAPERS = {A4:[210,297], A5:[148,210]};
const FONTS = [
  {k:'changa', n:'شانقا — Changa',        css:"'Changa'"},
  {k:'amiri',  n:'أميري — Amiri',         css:"'Amiri'"},
  {k:'naskh',  n:'النسخ — Noto Naskh',     css:"'Noto Naskh Arabic'"},
  {k:'cairo',  n:'القاهرة — Cairo',        css:"'Cairo'"},
  {k:'kufi',   n:'الكوفي — Reem Kufi',     css:"'Reem Kufi'"},
  {k:'plex',   n:'بلكس — IBM Plex',        css:"'IBM Plex Sans Arabic'"},
  {k:'roboto', n:'Roboto',               css:"'Roboto'"},
  {k:'mont',   n:'Montserrat',           css:"'Montserrat'"},
  {k:'lora',   n:'Lora',                 css:"'Lora'"}
];
const ALIGN = {r:'right', c:'center', l:'left'};
const VALIGN = {t:'flex-start', m:'center', b:'flex-end'};

const MOTIF_SVG = `<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 120 120'><g fill='none' stroke='#F0D59A' stroke-width='1.1' stroke-linejoin='round'><rect x='14' y='22' width='34' height='22' rx='4' transform='rotate(-10 31 33)'/><path d='M22 32h18M25 37h12' transform='rotate(-10 31 33)'/><rect x='72' y='78' width='34' height='22' rx='4' transform='rotate(8 89 89)'/><path d='M80 88h18M83 93h12' transform='rotate(8 89 89)'/></g></svg>`;
document.documentElement.style.setProperty('--motif', `url("data:image/svg+xml,${encodeURIComponent(MOTIF_SVG)}")`);
const WAVES = `<svg class="waves" viewBox="0 0 1200 24" preserveAspectRatio="none" aria-hidden="true">
  <path class="w1" d="M0 10 C 200 0, 380 22, 600 10 S 980 0, 1200 12"/>
  <path class="w2" d="M0 14 C 220 4, 400 26, 620 14 S 1000 4, 1200 16 L1200 24 L0 24 Z"/></svg>`;

const svg = p => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${p}</svg>`;
const IC = {
  print: svg('<path d="M7 8V4h10v4"/><rect x="3.5" y="8" width="17" height="8" rx="2.5"/><path d="M7 14h10v6H7z"/>'),
  label: svg('<rect x="3.5" y="6" width="17" height="12" rx="2.5"/><path d="M7.5 10.5h9M9 14h6"/>'),
  sheet: svg('<rect x="5" y="3" width="14" height="18" rx="2"/><path d="M5 9h14M5 15h14M12 3v18"/>'),
  menu:  svg('<path d="M5 7h14M5 12h14M5 17h9"/>'),
  install: svg('<path d="M12 4v11M7.5 10.5L12 15l4.5-4.5M5 19h14"/>'),
  plus:  svg('<path d="M12 5v14M5 12h14"/>'),
  edit:  svg('<path d="M4 20h4L19 9l-4-4L4 16z"/><path d="M13.5 6.5l4 4"/>'),
  copy:  svg('<rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V5a1 1 0 0 0-1-1H5a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h3"/>'),
  trash: svg('<path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/>'),
  fill:  svg('<rect x="4" y="4" width="16" height="16" rx="2"/><path d="M4 12h16M12 4v16"/><path d="M14 14h4v4h-4z" fill="currentColor"/>'),
  image: svg('<rect x="3.5" y="4.5" width="17" height="15" rx="2.5"/><circle cx="9" cy="10" r="1.8"/><path d="M20.5 16l-5-5-8.5 8.5"/>'),
  up:    svg('<path d="M12 19V5M6 11l6-6 6 6"/>'),
  x:     svg('<path d="M7 7l10 10M17 7L7 17"/>'),
  right: svg('<path d="M9 6l6 6-6 6"/>'),
  left:  svg('<path d="M15 6l-6 6 6 6"/>')
};

/* ═══════════ أدوات ═══════════ */
const $ = (s, r=document) => r.querySelector(s);
const $$ = (s, r=document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,6);
const num = (v, d=0) => { const n = parseFloat(String(v).replace(',', '.')); return isFinite(n) ? n : d; };
const r2 = n => Math.round(n * 100) / 100;
const clone = o => JSON.parse(JSON.stringify(o));
const LS = {
  get(k, d=null){ try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch(e){ return d; } },
  set(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){ toast('تعذّر الحفظ على الجهاز', true); } }
};
function toast(msg, err=false){
  $$('.toast').forEach(t => t.remove());
  const t = document.createElement('div'); t.className = 'toast' + (err ? ' err' : ''); t.textContent = msg;
  document.body.appendChild(t); setTimeout(() => t.remove(), 2400);
}

/* ═══════════ البيانات ═══════════ */
function seed(){
  const t1 = {id:uid(), name:'3 × 8 — 70×37', paper:'A4', w:70, h:37, cols:3, rows:8, top:0.4, side:0, gx:0, gy:0};
  const t2 = {id:uid(), name:'2 × 7 — 99×38', paper:'A4', w:99, h:38, cols:2, rows:7, top:15.5, side:6, gx:0, gy:0};
  const c1 = {id:uid(), name:'مثال: براغي M6', tplId:t1.id, align:'c', valign:'m', rot:0, pad:2, lh:1.25, lgap:0.5, fit:true, lines:[
    {t:'براغي M6', f:'changa', s:18, b:true}, {t:'Vis M6 × 30', f:'roboto', s:10, b:false}, {t:'العلبة: 100 قطعة', f:'naskh', s:11, b:false}]};
  return {tpls:[t1, t2], items:[c1], queue:[{itemId:c1.id, qty:24}], tplId:t1.id, start:1, border:false, cal:{x:0, y:0}};
}
let D = LS.get('lsq_data') || seed();
function normalize(){
  D.tpls ||= []; D.items ||= []; D.queue ||= []; D.cal ||= {x:0, y:0}; D.start ||= 1;
  if (!D.tpls.length) D = seed();
  D.tpls.forEach(t => { t.paper ||= 'A4'; t.feed ||= 'a4'; });
  D.items.forEach(i => { i.rot = +i.rot || 0; i.lgap ??= 0; });
}
normalize();
const save = () => LS.set('lsq_data', D);
const tplById = id => D.tpls.find(t => t.id === id);
const tpl = () => tplById(D.tplId) || D.tpls[0];
const itemById = id => D.items.find(i => i.id === id);
const fontOf = k => FONTS.find(f => f.k === k) || FONTS[0];
const perSheet = T => T.cols * T.rows;
const paperWH = T => T.paper === 'custom' ? [num(T.pw, 210), num(T.ph, 297)] : (PAPERS[T.paper] || PAPERS.A4);
const feedA4 = T => { const [pw, ph] = paperWH(T); return T.paper !== 'A4' && (T.feed || 'a4') === 'a4' && pw <= 210 && ph <= 297; };
const paperName = T => T.paper === 'custom' ? `${paperWH(T).join('×')} ملم` : T.paper;

let S = { tab:'print', page:0 };

/* ═══════════ رسم اللصيقة والورقة ═══════════ */
function linesHTML(it){
  const gap = num(it.lgap);
  return `<div class="lb-in" style="line-height:${it.lh || 1.25}">${it.lines.map((l, k) => {
    const F = fontOf(l.f);
    return `<div class="ln" dir="auto" style="font-family:${F.css},'IBM Plex Sans Arabic',sans-serif;font-size:calc(${num(l.s,12)}pt * var(--k,1));font-weight:${l.b ? 700 : 400}${k && gap ? `;margin-top:calc(${gap}mm * var(--k,1))` : ''}">${esc(l.t) || '&nbsp;'}</div>`;
  }).join('')}</div>`;
}
/* صندوق المحتوى داخل اللصيقة؛ عند الدوران تُقلب أبعاده ويدور حول مركزه */
function boxHTML(it, T){
  const rot = +it.rot || 0, bw = rot ? T.h : T.w, bh = rot ? T.w : T.h;
  return `<div class="lb-box" ${it.fit ? 'data-fit' : ''} style="width:${bw}mm;height:${bh}mm;padding:${num(it.pad,2)}mm;justify-content:${VALIGN[it.valign] || 'center'};text-align:${ALIGN[it.align] || 'center'};transform:translate(-50%,-50%) rotate(${rot}deg)">${linesHTML(it)}</div>`;
}
function cellPos(T, idx){
  const r = Math.floor(idx / T.cols), c = idx % T.cols;
  return { x: r2(T.side + c * (T.w + T.gx)), y: r2(T.top + r * (T.h + T.gy)) };
}
/* mode: preview | print | test | outline */
function pageHTML(T, cells, mode, pageNo=0){
  const [pw, ph] = paperWH(T), per = perSheet(T);
  const shift = (mode === 'print' || mode === 'test') ? `transform:translate(${num(D.cal.x)}mm,${num(D.cal.y)}mm)` : '';
  let h = '';
  for (let i = 0; i < per; i++){
    const {x, y} = cellPos(T, i), c = cells[i];
    const base = `right:${x}mm;top:${y}mm;width:${T.w}mm;height:${T.h}mm`;
    const click = mode === 'preview' && pageNo === 0 ? ' click' : '';
    if (mode === 'test'){ h += `<div class="lb test" style="${base}">${i+1}</div>`; continue; }
    if (mode === 'outline'){ h += `<div class="lb empty" style="${base}"></div>`; continue; }
    if (c && c !== 'skip') h += `<div class="lb${D.border ? ' bd' : ''}${click}" data-i="${i}" style="${base}">${boxHTML(c, T)}</div>`;
    else if (mode === 'preview') h += `<div class="lb ${c === 'skip' ? 'skip' : 'empty'}${click}" data-i="${i}" style="${base}"></div>`;
  }
  const inner = `<div class="page-in" style="${shift}">${h}</div>`;
  /* ورقة صغيرة تُطبع على إعداد A4: تُرسم في وسط الصفحة أفقياً وملاصقة للأعلى (مثل موضعها في درج الطابعة) */
  if ((mode === 'print' || mode === 'test') && feedA4(T))
    return `<div class="page" style="width:210mm;height:296.8mm"><div style="position:absolute;top:0;right:${r2((210 - pw) / 2)}mm;width:${pw}mm;height:${ph}mm;overflow:hidden">${inner}</div></div>`;
  return `<div class="page" style="width:${pw}mm;height:${r2(ph - 0.2)}mm">${inner}</div>`;
}
function innerFree(box){
  const cs = getComputedStyle(box);
  return [box.clientWidth - num(cs.paddingLeft) - num(cs.paddingRight), box.clientHeight - num(cs.paddingTop) - num(cs.paddingBottom)];
}
function fitAll(root){
  $$('.lb-box[data-fit]', root).forEach(box => {
    const inn = box.firstElementChild; if (!inn) return;
    inn.style.setProperty('--k', 1);
    const [aw, ah] = innerFree(box);
    const k = Math.min(1, aw / inn.offsetWidth, ah / inn.offsetHeight);
    if (k < 1) inn.style.setProperty('--k', (k * 0.97).toFixed(3));
  });
}
function overflows(box){
  const inn = box.firstElementChild, [aw, ah] = innerFree(box);
  return inn.offsetWidth > aw + 1 || inn.offsetHeight > ah + 1;
}
function soloHTML(it, T, maxW, maxH){
  const s = Math.min(maxW / (T.w * MM), maxH / (T.h * MM));
  return `<div class="solo" style="width:${T.w*MM*s}px;height:${T.h*MM*s}px"><div class="lb" style="width:${T.w}mm;height:${T.h}mm;transform:scale(${s})">${boxHTML(it, T)}</div></div>`;
}
function sheetThumb(T, w){
  const [pw, ph] = paperWH(T), s = w / (pw * MM);
  return `<div class="thumb pv" style="width:${w}px;height:${ph*MM*s}px"><div style="position:absolute;top:0;right:0;transform:scale(${s});transform-origin:top right">${pageHTML(T, [], 'outline')}</div></div>`;
}
function buildCells(){
  const T = tpl(), per = perSheet(T), seq = [];
  D.queue.forEach(q => { const it = itemById(q.itemId); if (it) for (let i = 0; i < q.qty; i++) seq.push(it); });
  const skip = Math.min(Math.max(1, D.start) - 1, per - 1);
  const pages = Math.max(1, Math.ceil((skip + seq.length) / per));
  const cells = new Array(pages * per).fill(null);
  for (let i = 0; i < skip; i++) cells[i] = 'skip';
  seq.forEach((it, i) => cells[skip + i] = it);
  return { cells, pages, per, count: seq.length, skip, T };
}

function closeSheet(){ const s = $('#sheet'); if (s) s.remove(); }
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeSheet(); });
function confirmBox(title, msg, okLabel='تأكيد', danger=false){

    openSheet(`<h3>${esc(title)}</h3><p class="txt" style="margin:0">${esc(msg)}</p>
      <div class="sheet-foot"><button class="btn ${danger ? 'danger' : 'primary'}" id="cf-ok">${esc(okLabel)}</button><button class="btn outline" id="cf-no">إلغاء</button></div>`, sh => {

const stepper = (id, val) => `<div class="stp" data-qty="${id}"><button data-d="1" aria-label="زيادة">+</button><input id="${id}" class="num" inputmode="decimal" value="${esc(val)}"><button data-d="-1" aria-label="إنقاص">−</button></div>`;
function bindSteppers(root, step, onSet){
  $$('[data-qty]', root).forEach(box => {
    const inp = $('input', box), st = typeof step === 'function' ? step(inp.id) : step;
    $$('button', box).forEach(b => b.onclick = () => { inp.value = r2(num(inp.value) + st * num(b.dataset.d)); onSet(inp.id, inp.value); });
    inp.onchange = () => onSet(inp.id, inp.value);
  });
}
const segHTML = (key, val, opts) => `<div class="seg" data-seg="${key}">${opts.map(([v,l]) => `<button type="button" data-v="${v}" class="${String(val) === String(v) ? 'on' : ''}">${l}</button>`).join('')}</div>`;
function bindSegs(root, onSet){
  $$('[data-seg]', root).forEach(sg => $$('button', sg).forEach(b => b.onclick = () => {
    $$('button', sg).forEach(x => x.classList.toggle('on', x === b)); onSet(sg.dataset.seg, b.dataset.v);
  }));
}

function renderPrint(){
  const T = tpl();
  $('#main').innerHTML = `<div class="ptab"><div>
    <div class="page-h"><h2>الطباعة</h2></div>
    <div class="panel">
      <div class="row"><div class="lbl">القالب</div><select class="sel" id="p-tpl">${D.tpls.map(t => `<option value="${t.id}" ${t.id === T.id ? 'selected' : ''}>${esc(t.name)}</option>`).join('')}</select></div>
      <div class="row"><div class="lbl">البدء من اللصيقة<small>لورقة مستعملة جزئياً</small></div>${stepper('p-start', D.start)}</div>
    </div>

function refreshPrint(){
  renderQueue(); drawPreview();
  const c = buildCells();
  $('#p-meta').textContent = c.count ? `${c.count} لصيقة · ${c.pages} ${c.pages > 1 ? 'أوراق' : 'ورقة'} ${paperName(c.T)}` : '';
}
function renderQueue(){
  const box = $('#p-queue'); if (!box) return;
  const T = tpl();
  D.queue = D.queue.filter(q => itemById(q.itemId));
  if (!D.queue.length){ box.innerHTML = `<div class="empty">اضغط «إضافة» لاختيار محتوى</div>`; return; }
  box.innerHTML = D.queue.map((q, k) => {
    const it = itemById(q.itemId), other = it.tplId && it.tplId !== T.id && tplById(it.tplId);
    return `<div class="row"><div class="lbl"><b>${esc(it.name)}</b>${other ? `<small>مصمَّم لقالب ${esc(other.name)}</small>` : ''}</div>
      ${stepper('q-' + k, q.qty)}<button class="ibtn" data-fill="${k}" title="املأ باقي الورقة" aria-label="املأ باقي الورقة">${IC.fill}</button><button class="ibtn danger" data-del="${k}" aria-label="حذف">${IC.x}</button></div>`;
  }).join('');
  bindSteppers(box, 1, (id, v) => { D.queue[+id.slice(2)].qty = Math.max(0, Math.round(num(v))); save(); refreshPrint(); });
  $$('[data-fill]', box).forEach(b => b.onclick = () => {
    const k = +b.dataset.fill, c = buildCells(), used = c.skip + c.count, rem = (c.per - used % c.per) % c.per;
    if (!rem && used) return toast('الورقة ممتلئة');
    D.queue[k].qty += rem || c.per; save(); refreshPrint();
  });
  $$('[data-del]', box).forEach(b => b.onclick = () => { D.queue.splice(+b.dataset.del, 1); save(); refreshPrint(); });
}
function drawPreview(){
  const pv = $('#pv'); if (!pv) return;
  const c = buildCells();
  S.page = Math.min(S.page, c.pages - 1);
  $('.sheet-scale', pv).innerHTML = pageHTML(c.T, c.cells.slice(S.page * c.per, (S.page + 1) * c.per), 'preview', S.page);
  $('#p-pager').innerHTML = c.pages > 1 ? `<button class="ibtn" id="pg-prev" ${S.page === 0 ? 'disabled' : ''} aria-label="السابقة">${IC.right}</button>
    <span class="num">${S.page + 1} / ${c.pages}</span><button class="ibtn" id="pg-next" ${S.page >= c.pages - 1 ? 'disabled' : ''} aria-label="التالية">${IC.left}</button>` : '';
  if ($('#pg-prev')){ $('#pg-prev').onclick = () => { S.page--; drawPreview(); }; $('#pg-next').onclick = () => { S.page++; drawPreview(); }; }
  scalePreview(); fitAll(pv);
}
function scalePreview(){
  const pv = $('#pv'); if (!pv) return;
  const [pw, ph] = paperWH(tpl()), s = pv.clientWidth / (pw * MM);
  $('.sheet-scale', pv).style.transform = `scale(${s})`;
  pv.style.height = (ph * MM * s) + 'px';
}
function openAddSheet(){
  if (!D.items.length){ toast('أنشئ محتوى أولاً'); goTab('items'); return; }
  openSheet(`<h3>إضافة للطباعة</h3><div class="cards">${D.items.map(it => { const T = tplById(it.tplId) || tpl();
    return `<button class="card pick" data-id="${it.id}">${soloHTML(it, T, 84, 54)}<div class="info"><b>${esc(it.name)}</b><small>${esc(T.name)}</small></div></button>`; }).join('')}</div>
    <div class="sheet-foot"><button class="btn outline" onclick="closeSheet()">إغلاق</button></div>`, sh => {
    fitAll(sh);
    $$('[data-id]', sh).forEach(b => b.onclick = () => { addToQueue(b.dataset.id); closeSheet(); if (S.tab === 'print') renderPrint(); });
  });
}
function addToQueue(id){
  const it = itemById(id); if (!it) return;
  if (!D.queue.length && tplById(it.tplId) && it.tplId !== D.tplId){ D.tplId = it.tplId; D.start = 1; }
  const c = buildCells(), used = c.skip + c.count, rem = (c.per - used % c.per) % c.per;
  const ex = D.queue.find(q => q.itemId === id);
  if (ex) ex.qty += rem || c.per; else D.queue.push({itemId:id, qty:rem || c.per});
  save();
}

async function doPrint(mode){
  const c = buildCells(), pa = $('#print-area'), [pw, ph] = feedA4(c.T) ? [210, 297] : paperWH(c.T);
  $('#page-size').textContent = `@media print{@page{size:${pw}mm ${ph}mm;margin:0}}`;

}
/* ═══════════ التنزيل كصورة PNG بدقة 300 نقطة/بوصة ═══════════ */
const CRC = (() => { const t = new Uint32Array(256); for (let n = 0; n < 256; n++){ let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; } return t; })();
const crc32 = b => { let c = 0xFFFFFFFF; for (let i = 0; i < b.length; i++) c = CRC[(c ^ b[i]) & 255] ^ (c >>> 8); return (c ^ 0xFFFFFFFF) >>> 0; };
/* كتابة الدقة داخل ملف PNG حتى يُطبع بمقاسه الحقيقي من أي برنامج صور */
async function pngWithDpi(blob, dpi){
  const src = new Uint8Array(await blob.arrayBuffer()), ppm = Math.round(dpi / 0.0254);
  const chunk = new Uint8Array(21), dv = new DataView(chunk.buffer);
  dv.setUint32(0, 9); chunk.set([0x70,0x48,0x59,0x73], 4); dv.setUint32(8, ppm); dv.setUint32(12, ppm); chunk[16] = 1;
  dv.setUint32(17, crc32(chunk.subarray(4, 17)));
  const out = new Uint8Array(src.length + 21);
  out.set(src.subarray(0, 33)); out.set(chunk, 33); out.set(src.subarray(33), 54);
  return new Blob([out], {type:'image/png'});

/* رسم ورقة كاملة على لوحة canvas بالمليمتر الحقيقي (بدون مكتبات) */
async function drawPageCanvas(T, cells, dpi){
  const [pw, ph] = paperWH(T), u = dpi / 25.4, pt = dpi / 72;
  const cv = document.createElement('canvas');
  cv.width = Math.round(pw * u); cv.height = Math.round(ph * u);
  const ctx = cv.getContext('2d');
  ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, cv.width, cv.height);
  const fontStr = (l, k) => `${l.b ? 700 : 400} ${num(l.s,12) * k * pt}px ${fontOf(l.f).css}, 'IBM Plex Sans Arabic', sans-serif`;
  const used = new Set(); cells.forEach(c => c && c !== 'skip' && c.lines.forEach(l => used.add(fontStr(l, 1))));
  await Promise.all([...used].map(f => document.fonts.load(f, 'ابجد abc').catch(() => {})));
  for (let i = 0; i < perSheet(T); i++){
    const it = cells[i]; if (!it || it === 'skip') continue;
    const {x, y} = cellPos(T, i), left = (pw - x - T.w) * u, top = y * u, w = T.w * u, h = T.h * u;
    const rot = +it.rot || 0, bw = rot ? h : w, bh = rot ? w : h, pad = num(it.pad, 2) * u, gap = num(it.lgap) * u, lh = it.lh || 1.25;
    const measure = k => { let mw = 0, th = 0; it.lines.forEach((l, j) => { ctx.font = fontStr(l, k); mw = Math.max(mw, ctx.measureText(l.t || ' ').width); th += num(l.s,12) * k * pt * lh + (j ? gap * k : 0); }); return [mw, th]; };
    let k = 1, [mw, th] = measure(1);
    const aw = bw - 2 * pad, ah = bh - 2 * pad;
    if (it.fit){ const r = Math.min(1, aw / mw, ah / th); if (r < 1){ k = r * 0.97; [mw, th] = measure(k); } }
    ctx.save();
    ctx.translate(left + w / 2, top + h / 2); ctx.rotate(rot * Math.PI / 180);
    ctx.beginPath(); ctx.rect(-bw / 2, -bh / 2, bw, bh); ctx.clip();
    let cy = it.valign === 't' ? -bh / 2 + pad : it.valign === 'b' ? bh / 2 - pad - th : -th / 2;
    const al = it.align || 'c', tx = al === 'r' ? bw / 2 - pad : al === 'l' ? -bw / 2 + pad : 0;
    ctx.fillStyle = '#111'; ctx.textBaseline = 'middle'; ctx.textAlign = al === 'r' ? 'right' : al === 'l' ? 'left' : 'center';
    it.lines.forEach((l, j) => {
      const fs = num(l.s,12) * k * pt, lhPx = fs * lh;
      if (j) cy += gap * k;
      ctx.font = fontStr(l, k); ctx.direction = /[؀-ۿ]/.test(l.t) ? 'rtl' : 'ltr';
      if (l.t) ctx.fillText(l.t, tx, cy + lhPx / 2);
      cy += lhPx;
    });
    ctx.restore();
    if (D.border){ ctx.strokeStyle = '#000'; ctx.lineWidth = 0.25 * u; ctx.strokeRect(left + 0.125 * u, top + 0.125 * u, w - 0.25 * u, h - 0.25 * u); }
  }
  return cv;
}
async function downloadImages(btn){
  const c = buildCells();
  if (btn){ btn.disabled = true; btn.lastChild.textContent = 'جارٍ…'; }
  try {
    const base = (c.T.name || 'lasiqat').replace(/[\\/:*?"<>|]+/g, '-').trim();
    for (let p = 0; p < c.pages; p++){
      const cv = await drawPageCanvas(c.T, c.cells.slice(p * c.per, (p + 1) * c.per), 300);
      const blob = await pngWithDpi(await new Promise(r => cv.toBlob(r, 'image/png')), 300);
      saveBlob(blob, c.pages > 1 ? `${base} - ${p + 1}.png` : `${base}.png`);
      await new Promise(r => setTimeout(r, 400));
    }
    toast(c.pages > 1 ? `نُزّلت ${c.pages} صور` : 'نُزّلت الصورة');
  } catch(err){ toast('تعذّر إنشاء الصورة', true); }
  finally { if (btn){ btn.disabled = false; btn.lastChild.textContent = 'صورة'; } }
}

    $('#m-exp', sh).onclick = () => {
      const blob = new Blob([JSON.stringify({app:'lasiqat', v:2, data:D}, null, 1)], {type:'application/json'});
      const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
      a.download = `lasiqat-${new Date().toISOString().slice(0,10)}.json`; document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(a.href), 2000);
    };
    $('#m-imp', sh).onclick = () => $('#m-file', sh).click();
    $('#m-file', sh).onchange = async e => {
      const f = e.target.files[0]; if (!f) return;
      try {
        const j = JSON.parse(await f.text()), nd = j.data || j;
        if (!Array.isArray(nd.tpls) || !nd.tpls.length || !Array.isArray(nd.items)) throw 0;
        if (!(await confirmBox('استيراد', `${nd.tpls.length} قالب و ${nd.items.length} محتوى. ستحل محل البيانات الحالية.`, 'استيراد'))) return;
        D = Object.assign({queue:[], start:1, border:false, cal:{x:0, y:0}}, nd); normalize();
        if (!tplById(D.tplId)) D.tplId = D.tpls[0].id;
        save(); toast('تم الاستيراد'); goTab('print');
      } catch(err){ toast('الملف غير صالح', true); }
    };
    if ($('#m-inst', sh)) $('#m-inst', sh).onclick = doInstall;
  });
}

/* ═══════════ البدء ═══════════ */
renderShell(); renderHead(); goTab('print');
document.fonts && document.fonts.ready.then(() => { if (S.tab === 'print') drawPreview(); else if (S.tab === 'items') fitAll($('#main')); });
</script>
</body>
